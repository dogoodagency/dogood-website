# Netlify can import this repo with no extra dashboard settings.
# Node is pinned so the build does not float to another major version.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects and 410s for the old Wix site live in public/_redirects
# (Netlify reads that file before the rules below). The rules here are
# only for renamed pages on the new site.

[[redirects]]
  from = "/for-advisors/resources"
  to = "/for-advisors/client-tools"
  status = 301

[[redirects]]
  from = "/for-advisors/resources/"
  to = "/for-advisors/client-tools"
  status = 301

[[redirects]]
  from = "/stories/j"
  to = "/casestudies/j"
  status = 301

[[redirects]]
  from = "/stories/j/"
  to = "/casestudies/j"
  status = 301

[[redirects]]
  from = "/stories/v"
  to = "/casestudies/v"
  status = 301

[[redirects]]
  from = "/stories/v/"
  to = "/casestudies/v"
  status = 301

[[redirects]]
  from = "/wayfinders/client-fit"
  to = "/wayfinders/clientfit"
  status = 301

[[redirects]]
  from = "/wayfinders/client-fit/"
  to = "/wayfinders/clientfit"
  status = 301

# Old Insights pages now point at their closest new articles
[[redirects]]
  from = "/insights/first-months-after-exit"
  to = "/insights/first-90-days-after-the-sale"
  status = 301

[[redirects]]
  from = "/insights/first-months-after-exit/"
  to = "/insights/first-90-days-after-the-sale"
  status = 301

[[redirects]]
  from = "/insights/who-are-you-now"
  to = "/insights/who-am-i-without-the-company"
  status = 301

[[redirects]]
  from = "/insights/who-are-you-now/"
  to = "/insights/who-am-i-without-the-company"
  status = 301

[[redirects]]
  from = "/insights/after-the-deal"
  to = "/insights/raising-the-personal-side-of-exit-with-a-client"
  status = 301

[[redirects]]
  from = "/insights/after-the-deal/"
  to = "/insights/raising-the-personal-side-of-exit-with-a-client"
  status = 301

[[redirects]]
  from = "/podcast"
  to = "/dogood-insider"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://assets.mailerlite.com https://tidycal.com; img-src 'self' data: https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to https://tawk.link https://*.tawk.link; font-src 'self' https://embed.tawk.to https://*.tawk.to; style-src 'self' 'unsafe-inline' https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to; script-src 'self' 'sha256-cBflvqgnJD7HwH/7LroswONfvjk4uNeFCDZzS1tvSMA=' https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to https://asset-tidycal.b-cdn.net https://www.buzzsprout.com; connect-src 'self' https://assets.mailerlite.com https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to wss://*.tawk.to https://tidycal.com; frame-src https://tidycal.com https://*.tidycal.com https://www.youtube-nocookie.com https://www.buzzsprout.com https://embed.tawk.to https://*.tawk.to https://www.google.com; upgrade-insecure-requests"
