[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Pre-launch: keeps every page out of Google and other search engines, and tells crawlers
    # not to follow links ("nofollow" restored 18 Nov 2026, Seb: not discoverable by any crawler).
    # Delete this whole X-Robots-Tag line at launch (see CHANGELOG.md, launch checklist).
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://assets.mailerlite.com https://tidycal.com; img-src 'self' data: https://cdn-cookieyes.com https://*.clarity.ms https://c.bing.com https://px.ads.linkedin.com https://*.google-analytics.com https://*.googletagmanager.com https://embed.tawk.to https://*.tawk.to https://tawk.link https://*.tawk.link; font-src 'self' https://embed.tawk.to https://*.tawk.to; style-src 'self' 'unsafe-inline' https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to; script-src 'self' 'sha256-cBflvqgnJD7HwH/7LroswONfvjk4uNeFCDZzS1tvSMA=' https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to https://asset-tidycal.b-cdn.net https://www.buzzsprout.com https://www.googletagmanager.com https://snap.licdn.com https://www.clarity.ms https://*.clarity.ms; connect-src 'self' https://*.clarity.ms https://px.ads.linkedin.com https://*.linkedin.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://assets.mailerlite.com https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to wss://*.tawk.to https://tidycal.com; frame-src https://tidycal.com https://*.tidycal.com https://www.youtube-nocookie.com https://www.buzzsprout.com https://embed.tawk.to https://*.tawk.to https://www.google.com; upgrade-insecure-requests"

# Browser caching. Files in /_astro/ have a content hash in their name, so they
# can be cached for a year. Images and fonts in /sketches, /media, /nav and
# /fonts keep their names when replaced, so they are cached for a week only.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sketches/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/nav/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
