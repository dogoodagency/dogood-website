# Netlify can import this repo with no extra dashboard settings.
# Node is pinned so the build does not float to another major version.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/founders"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/founders/"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/stories/j"
  to = "/casestudies/j"
  status = 301

[[redirects]]
  from = "/stories/j/"
  to = "/casestudies/j"
  status = 301

[[redirects]]
  from = "/stories/v"
  to = "/casestudies/v"
  status = 301

[[redirects]]
  from = "/stories/v/"
  to = "/casestudies/v"
  status = 301

[[redirects]]
  from = "/wayfinders/client-fit"
  to = "/wayfinders/clientfit"
  status = 301

[[redirects]]
  from = "/wayfinders/client-fit/"
  to = "/wayfinders/clientfit"
  status = 301

[[redirects]]
  from = "/culture-teams"
  to = "/"
  status = 301

[[redirects]]
  from = "/culture-teams/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/culture-build-employee-engagement-consulting"
  to = "/"
  status = 301

[[redirects]]
  from = "/skill-boost-employee-training-and-development"
  to = "/"
  status = 301

[[redirects]]
  from = "/sop-development"
  to = "/"
  status = 301

[[redirects]]
  from = "/strategic-hiring-and-employee-onboarding"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://assets.mailerlite.com https://tidycal.com; img-src 'self' data: https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to https://tawk.link https://*.tawk.link; font-src 'self' https://embed.tawk.to; style-src 'self' 'unsafe-inline' https://cdn-cookieyes.com https://embed.tawk.to; script-src 'self' https://cdn-cookieyes.com https://embed.tawk.to https://asset-tidycal.b-cdn.net https://www.buzzsprout.com; connect-src 'self' https://assets.mailerlite.com https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to wss://*.tawk.to https://tidycal.com; frame-src https://tidycal.com https://*.tidycal.com https://www.youtube-nocookie.com https://www.buzzsprout.com https://embed.tawk.to; upgrade-insecure-requests"
