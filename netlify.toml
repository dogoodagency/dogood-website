# Netlify can import this repo with no extra dashboard settings.
# Node is pinned so the build does not float to another major version.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects and 410s for the old Wix site live in public/_redirects
# (Netlify reads that file before the rules below). The rules here are
# for renamed pages on the new site, followed by host/protocol canonicalization.
# Permanent path redirects use the final HTTPS www URL to avoid a second hop.

# Advisor Center moved from /for-advisors to /advisor-center (Seb, 20 Nov 2026).
[[redirects]]
  from = "/for-advisors/resources"
  to = "https://www.dogoodagency.co/advisor-center/client-tools"
  status = 301

[[redirects]]
  from = "/for-advisors/resources/"
  to = "https://www.dogoodagency.co/advisor-center/client-tools"
  status = 301

[[redirects]]
  from = "/for-advisors"
  to = "https://www.dogoodagency.co/advisor-center"
  status = 301

[[redirects]]
  from = "/for-advisors/"
  to = "https://www.dogoodagency.co/advisor-center"
  status = 301

[[redirects]]
  from = "/for-advisors/*"
  to = "https://www.dogoodagency.co/advisor-center/:splat"
  status = 301

[[redirects]]
  from = "/stories/j"
  to = "https://www.dogoodagency.co/casestudies/j"
  status = 301

[[redirects]]
  from = "/stories/j/"
  to = "https://www.dogoodagency.co/casestudies/j"
  status = 301

[[redirects]]
  from = "/stories/v"
  to = "https://www.dogoodagency.co/casestudies/v"
  status = 301

[[redirects]]
  from = "/stories/v/"
  to = "https://www.dogoodagency.co/casestudies/v"
  status = 301

[[redirects]]
  from = "/wayfinders/client-fit"
  to = "https://www.dogoodagency.co/wayfinders/clientfit"
  status = 301

[[redirects]]
  from = "/wayfinders/client-fit/"
  to = "https://www.dogoodagency.co/wayfinders/clientfit"
  status = 301

# Old Insights pages now point at their closest new articles
[[redirects]]
  from = "/insights/first-months-after-exit"
  to = "https://www.dogoodagency.co/insights/first-90-days-after-the-sale"
  status = 301

[[redirects]]
  from = "/insights/first-months-after-exit/"
  to = "https://www.dogoodagency.co/insights/first-90-days-after-the-sale"
  status = 301

[[redirects]]
  from = "/insights/who-are-you-now"
  to = "https://www.dogoodagency.co/insights"
  status = 301

[[redirects]]
  from = "/insights/who-are-you-now/"
  to = "https://www.dogoodagency.co/insights"
  status = 301

[[redirects]]
  from = "/insights/after-the-deal"
  to = "https://www.dogoodagency.co/insights"
  status = 301

[[redirects]]
