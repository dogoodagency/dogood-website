[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://assets.mailerlite.com https://tidycal.com; img-src 'self' data: https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to https://tawk.link https://*.tawk.link; font-src 'self' https://embed.tawk.to https://*.tawk.to; style-src 'self' 'unsafe-inline' https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to; script-src 'self' 'sha256-cBflvqgnJD7HwH/7LroswONfvjk4uNeFCDZzS1tvSMA=' https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to https://asset-tidycal.b-cdn.net https://www.buzzsprout.com; connect-src 'self' https://assets.mailerlite.com https://cdn-cookieyes.com https://embed.tawk.to https://*.tawk.to wss://*.tawk.to https://tidycal.com; frame-src https://tidycal.com https://*.tidycal.com https://www.youtube-nocookie.com https://www.buzzsprout.com https://embed.tawk.to https://*.tawk.to https://www.google.com; upgrade-insecure-requests"
