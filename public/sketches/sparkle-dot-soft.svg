    <stop offset="0" stop-color="#FEFEF3" stop-opacity="1"/><stop offset="0.35" stop-color="#FEFEF3" stop-opacity="0.9"/>
    <stop offset="0.6" stop-color="#FEFABE" stop-opacity="0.35"/><stop offset="1" stop-color="#FEFABE" stop-opacity="0"/></radialGradient></defs>
  <circle cx="6" cy="6" r="6" fill="url(#d)"/>
</svg>
